name: sovereign-dns

# Caps each container's log at 3 x 10 MB. nvpn's entrypoint follows the daemon
# log into the container log with `tail -F`, and Docker's json-file driver keeps
# everything by default: on Docker Desktop that fills the VM disk, Pi-hole dies,
# and every device on the mesh loses DNS. Every service uses this.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # NostrVPN node. This container is the "DNS device" the network admin
  # selects with `nvpn set --network-dns-node <this device's npub>
  # --network-dns-override`. Every other device on the mesh then resolves
  # through Pi-hole below — no per-device configuration.
  nvpn:
    build:
      context: ./nvpn
      args:
        NVPN_REPO: https://github.com/btcforplebs/nostr-vpn.git
        # A full commit SHA, not a branch: the build checks it out exactly and
        # fails if the fetched commit is anything else. Change the pin here,
        # where it is visible, rather than in .env.
        NVPN_COMMIT: 0c491f3cf896da1c7b74ddb65d090080b8972f14
    container_name: sovereign-dns-nvpn
    logging: *logging
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - nvpn-config:/root/.config/nvpn
    environment:
      # Read from SOVEREIGN_DNS_LOG, never from RUST_LOG: compose lets the
      # caller's shell override .env, and RUST_LOG is a common name that a shell
      # (an agent's, a dev's) often sets for its own Rust tools, which silently
      # changed this daemon's logging once. Set SOVEREIGN_DNS_LOG in .env, or
      # in the shell for one run, to change verbosity on purpose.
      RUST_LOG: ${SOVEREIGN_DNS_LOG:-info}
      # Only used in printed instructions, so they show the real panel URL.
      WEB_UI_PORT: ${WEB_UI_PORT:-8082}
      # Optional. Set to "<host-lan-or-public-ip>:51820" to advertise a
      # specific address to other devices. Left empty, the daemon discovers
      # its own mapping via STUN, which only works because the port below is
      # published.
      NVPN_ADVERTISED_ENDPOINT: ${NVPN_ADVERTISED_ENDPOINT:-}
      # on: dial nvpn's two built-in public FIPS transit seeds (joins the
      # public FIPS mesh). off: never dial them. See .env.example.
      NVPN_FIPS_BOOTSTRAP: ${NVPN_FIPS_BOOTSTRAP:-on}
    # WireGuard underlay. Without this published, the container's only
    # address is the Docker-internal 172.28.53.10, which no other device can
    # reach and which STUN cannot map — peers then show as present (they
    # announce over the relays) while no data path ever forms, so DNS reaches
    # nobody. Published on all host interfaces on purpose: this is the port
    # other devices connect *to*, and it is an authenticated WireGuard
    # listener, not an admin surface.
    ports:
      - "${NVPN_LISTEN_PORT:-51820}:51820/udp"
    networks:
      dns-internal:
        ipv4_address: 172.28.53.10
    healthcheck:
      # `nvpn status` exits 0 even with the daemon stopped (it prints
      # "daemon: stopped"), so the exit code alone called a dead daemon healthy.
      # Also red when the daemon runs but never brought the tunnel up
      # (0 peers, "no transport available"): the same interface check Pi-hole's
      # healthcheck makes below.
      test: ["CMD-SHELL", "nvpn status --discover-secs 0 2>/dev/null | grep -q '^daemon: running' && grep -q '${NVPN_TUN_IFACE:-utun100}' /proc/net/dev"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Browser control panel (nvpn-web) for approving join requests, adding
  # devices, etc. without touching a terminal — the same image nvpn builds,
  # just run with a different entrypoint/command. Reads the *same* config
  # volume as nvpn's actual daemon rather than running its own, hence
  # NVPN_EXTERNAL_DAEMON + state-file status mode. Binds 0.0.0.0 inside the
  # container (required for Docker's port publish to reach it at all) but
  # is only ever published to the host's loopback — this server has no
  # login of its own, so exposing it beyond localhost would let anyone who
  # can reach that port approve/remove devices on your mesh. Other computers
  # reach it through the hub, behind the hub password (hub/lanpanel.go).
  web:
    build:
      context: ./nvpn
      args:
        NVPN_REPO: https://github.com/btcforplebs/nostr-vpn.git
        NVPN_COMMIT: 0c491f3cf896da1c7b74ddb65d090080b8972f14
    container_name: sovereign-dns-web
    logging: *logging
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/nvpn-web"]
    command:
      - --listen
      - 0.0.0.0:8081
      - --behind-trusted-proxy
      - --config
      - /root/.config/nvpn/config.toml
    depends_on:
      nvpn:
        condition: service_healthy
    volumes:
      - nvpn-config:/root/.config/nvpn
    environment:
      NVPN_CLI_PATH: /usr/local/bin/nvpn
      NVPN_EXTERNAL_DAEMON: "true"
      NVPN_DAEMON_STATUS_MODE: state-file
      RUST_LOG: ${SOVEREIGN_DNS_LOG:-info}   # see the nvpn service
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-8082}:8081"

  # Pi-hole shares the nvpn container's network namespace so it can bind the
  # mesh tunnel interface (utun100) directly: DNS queries arriving at this
  # device's mesh IP hit Pi-hole, while nvpn's own stubs keep 127.0.0.1.
  # Binding per address (dnsmasq bind-dynamic, below) is what keeps the two
  # from colliding, and it follows the mesh address when it changes.
  pihole:
    # Pinned by digest (the tag is for people; Docker uses only the digest).
    # Bump both together: scripts/check-pins.sh fails on an unpinned image.
    image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    container_name: sovereign-dns-pihole
    logging: *logging
    restart: unless-stopped
    network_mode: service:nvpn
    depends_on:
      nvpn:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      # Upstream is Unbound only — fully recursive, no Google/Cloudflare.
      FTLCONF_dns_upstreams: 172.28.53.11#53
      FTLCONF_dns_interface: ${NVPN_TUN_IFACE:-utun100}
      # NONE: FTL writes no listening config; the three dnsmasq lines below
      # are all of it. Not BIND: BIND binds the addresses an interface has
      # when Pi-hole starts and never looks again. A second box starts on its
      # own network, and joining the first box gives the tunnel a new address,
      # so Pi-hole listened on an address the box no longer had: the admin
      # page answered on the mesh (the web server listens everywhere) and
      # every lookup timed out, with no error anywhere. bind-dynamic binds
      # each address as it appears and drops it as it goes, still only on
      # these interfaces, so 127.0.0.1:53 stays free for nvpn. (dnsmasq dies
      # if bind-interfaces, which BIND writes, and bind-dynamic are both set.)
      FTLCONF_dns_listeningMode: NONE
      # The mesh tunnel, and nvpn's dns-internal address (172.28.53.10, eth0
      # in this namespace), which dns-lan below forwards the home network's
      # queries to. That address is not published: the internet cannot reach
      # it, but on Linux the host itself can, and so can a home-network
      # machine that adds a route to 172.28.53.0/24 through the host, with no
      # sender check there. scripts/check-pins.sh allows exactly these lines.
      FTLCONF_misc_dnsmasq_lines: "interface=${NVPN_TUN_IFACE:-utun100};interface=eth0;bind-dynamic"
      FTLCONF_dns_dnssec: "true"
      # Per-client rate limit, raised from FTL's 1000 a minute. Every device on
      # the mesh is one client, and the busiest one already peaks near 833 a
      # minute. Raised, not turned off: it is the only brake if a mesh peer
      # floods the resolver. scripts/check-pins.sh fails if either value moves.
      FTLCONF_dns_rateLimit_count: "5000"
      FTLCONF_dns_rateLimit_interval: "60"
      # No NTP server. Stock FTL listens on 0.0.0.0:123 and [::]:123, which
      # serves time to every mesh device; the box has no reason to. One line
      # per address family: each closes only its own socket.
      # scripts/check-pins.sh fails if either line is lost.
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      # No NTP client either. Setting the clock needs CAP_SYS_TIME, which this
      # container does not have, so FTL only logs "NTP client not available".
      # The clock comes from the host (Docker Desktop syncs its VM's clock).
      FTLCONF_ntp_sync_active: "false"
      # The web UI is reachable over the mesh at http://<mesh-ip>/admin
      FTLCONF_webserver_port: ${PIHOLE_WEB_PORT:-80}
    volumes:
      - pihole-config:/etc/pihole
    cap_add:
      - NET_BIND_SERVICE
    # Pi-hole lives inside nvpn's network namespace, and that binding does not
    # survive nvpn being recreated or restarted: Docker leaves this container
    # attached to a namespace that no longer has the mesh interface, so it
    # keeps reporting healthy and answering on its own loopback while DNS is
    # dead for every real client. Checking for the tunnel interface itself is
    # what makes that state visible instead of silent. Recreate this service
    # after anything that restarts nvpn.
    healthcheck:
      test: ["CMD-SHELL", "grep -q '${NVPN_TUN_IFACE:-utun100}' /proc/net/dev"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Unbound: recursive resolver walking down from the root servers, DNSSEC
  # validating. Internal-only — nothing is published to the host or the mesh;
  # only Pi-hole talks to it.
  unbound:
    # Built from unbound/Dockerfile: a digest-pinned Alpine base with exact
    # package versions, native on arm64 and amd64. scripts/check-pins.sh fails
    # if either pin goes missing. It replaces mvance/unbound, which is
    # amd64-only and ran under emulation on Apple Silicon until that emulation
    # broke. No forward-zone exists anywhere in the image's config, so nothing
    # needs mounting over it.
    build:
      context: ./unbound
    container_name: sovereign-dns-unbound
    logging: *logging
    restart: unless-stopped
    networks:
      dns-internal:
        ipv4_address: 172.28.53.11
    healthcheck:
      # Resolves a never-before-seen name every run, so it fails as soon as
      # recursion breaks instead of answering from cache. See the script.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Landing page: what's running, the real URLs with the mesh IP filled in,
  # and the invite command that otherwise only exists in `docker compose logs`.
  # Read-only by design, with two exceptions, both made through the control
  # panel's API and never by itself: the network DNS on/off switch
  # (hub/dns.go) and adding a device from its join link (hub/join.go). It launches the other UIs rather than duplicating them, holds no
  # credentials, and gets no docker.sock (a web-facing container with the
  # socket is root on the host). Joined to dns-internal so
  # it can probe Pi-hole and Unbound, which the browser cannot reach.
  # Published to loopback only by default: it fronts an admin surface, and with
  # no HUB_PASSWORD it has no login. A box with no screen can publish it to the
  # home network instead (scripts/hub-lan.sh on, which sets HUB_BIND=0.0.0.0
  # and HUB_PASSWORD). Then every page needs the password, only private
  # addresses are served, and the hub refuses to start on the network without
  # a password (hub/auth.go). scripts/check-pins.sh holds the port and the
  # HUB_BIND the hub reads to the same variable.
  hub:
    build:
      context: ./hub
    container_name: sovereign-dns-hub
    logging: *logging
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WEB_UI_PORT: ${WEB_UI_PORT:-8082}
      DOCS_PORT: ${DOCS_PORT:-8081}
      PIHOLE_WEB_PORT: ${PIHOLE_WEB_PORT:-80}
      # Where the port below is published, so the hub knows whether it is on
      # the network, plus the password that then guards it.
      HUB_BIND: ${HUB_BIND:-127.0.0.1}
      HUB_PASSWORD: ${HUB_PASSWORD:-}
      # on: also answer the mesh, through hub-mesh below, at
      # http://<this box's mesh IP>:8080 (scripts/hub-mesh.sh). Needs
      # HUB_PASSWORD: the hub refuses to start without it (hub/mesh.go).
      HUB_MESH: ${HUB_MESH:-off}
      # The VPN control panel from the home network, behind the same password
      # (hub/lanpanel.go). Served only while HUB_BIND is not loopback.
      HUB_PANEL_PORT: ${HUB_PANEL_PORT:-8083}
    depends_on:
      nvpn:
        condition: service_healthy
    # Both networks on purpose: the panel and docs sit on the default network,
    # Pi-hole and Unbound only on dns-internal. A fixed address on dns-internal
    # because hub-mesh, inside nvpn's namespace, dials it there.
    networks:
      default:
      dns-internal:
        ipv4_address: 172.28.53.12
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8080}:8080"
      - "${HUB_BIND:-127.0.0.1}:${HUB_PANEL_PORT:-8083}:8092"

  # The hub from the mesh. Mesh traffic arrives inside nvpn's namespace, where
  # nothing the host publishes can be reached, so this gate runs there, like
  # Pi-hole, and listens on port 8080 of the box's mesh address. It passes mesh
  # devices (10.44.0.0/16 only) to the hub's mesh port, which exists only with
  # HUB_MESH=on and a password, and needs the login on every page. Same image
  # as the hub, so it has no shell either. Publishes nothing on the host and
  # changes no firewall rule: only devices the network's admin added get here.
  # Like Pi-hole, recreate it after anything that restarts nvpn; its
  # healthcheck goes red when the tunnel is gone. See hub/mesh.go.
  hub-mesh:
    build:
      context: ./hub
    container_name: sovereign-dns-hub-mesh
    logging: *logging
    restart: unless-stopped
    command: ["mesh-gate"]
    network_mode: service:nvpn
    depends_on:
      nvpn:
        condition: service_healthy
      hub:
        condition: service_started
    environment:
      NVPN_TUN_IFACE: ${NVPN_TUN_IFACE:-utun100}
    healthcheck:
      test: ["CMD", "/hub", "mesh-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # DNS for the home network: lets the router hand this box out as every
  # device's DNS server, with no app on any of them. Off unless
  # scripts/dns-lan.sh turns it on (it sets COMPOSE_PROFILES=dns-lan and
  # DNS_LAN_BIND in .env). Pi-hole sits in nvpn's namespace, where a port the
  # host publishes cannot land, so this forwarder takes the queries on the
  # box's home-network address and hands each one to Pi-hole at
  # 172.28.53.10, carrying the asking device's address so Pi-hole's log and
  # rate limit see each device and not this container. Answers private
  # addresses only. On Linux that holds even through a router port forward.
  # On Docker Desktop (macOS, Windows) no sender check is possible: every
  # query arrives from the VM's private gateway, so a port forward would make
  # an open resolver, and the whole house is one client to Pi-hole's rate
  # limit. scripts/dns-lan.sh refuses there unless told to. Never forward 53.
  # No environment: the upstream is Pi-hole (172.28.53.10:53), built in, and
  # scripts/check-pins.sh fails if one is added.
  # Published on one address (DNS_LAN_BIND), never 0.0.0.0: on Linux,
  # systemd-resolved already holds 127.0.0.53:53, and a wildcard bind on
  # port 53 then fails. Same image as the hub. See hub/dnslan.go.
  dns-lan:
    build:
      context: ./hub
    container_name: sovereign-dns-dns-lan
    logging: *logging
    restart: unless-stopped
    profiles: ["dns-lan"]
    command: ["dns-lan"]
    depends_on:
      pihole:
        condition: service_healthy
    networks:
      dns-internal:
        ipv4_address: 172.28.53.13
    ports:
      - "${DNS_LAN_BIND:-127.0.0.1}:53:5353/udp"
      - "${DNS_LAN_BIND:-127.0.0.1}:53:5353/tcp"
    healthcheck:
      test: ["CMD", "/hub", "dns-lan-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Self-hosted docs site (mdBook) — explains the whole stack in plain
  # language plus the technical detail behind each layer. Off by default:
  # the dashboard links to the same guide on GitHub instead, so a normal
  # install downloads and runs one container fewer. For a box that has to
  # read them offline, add docs to COMPOSE_PROFILES in .env (for example
  # COMPOSE_PROFILES=docs) and run docker compose up -d; the dashboard then
  # links here. Runs standalone, no dependency on the other services.
  # Loopback only, like the hub and the web UI: nothing on the LAN needs it,
  # and scripts/check-pins.sh allows no other publish.
  docs:
    profiles: [docs]
    build:
      context: ./docs
    container_name: sovereign-dns-docs
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCS_PORT:-8081}:80"

networks:
  dns-internal:
    driver: bridge
    internal: false   # nvpn needs outbound reach (relay + WireGuard underlay); unbound needs the root servers
    ipam:
      config:
        - subnet: 172.28.53.0/24

volumes:
  nvpn-config:
  pihole-config:
