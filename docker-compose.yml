name: sovereign-dns

services:
  # NostrVPN node. This container is the "DNS device" the network admin
  # selects with `nvpn set --network-dns-node <this device's npub>
  # --network-dns-override`. Every other device on the mesh then resolves
  # through Pi-hole below — no per-device configuration.
  nvpn:
    build:
      context: ./nvpn
      args:
        NVPN_REPO: https://github.com/btcforplebs/nostr-vpn.git
        # A full commit SHA, not a branch: the build checks it out exactly and
        # fails if the fetched commit is anything else. Change the pin here,
        # where it is visible, rather than in .env.
        NVPN_COMMIT: fc0ab76574134809536bb2414ec3d5684cfd34a1
    container_name: sovereign-dns-nvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - nvpn-config:/root/.config/nvpn
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Only used in printed instructions, so they show the real panel URL.
      WEB_UI_PORT: ${WEB_UI_PORT:-8082}
      # Optional. Set to "<host-lan-or-public-ip>:51820" to advertise a
      # specific address to other devices. Left empty, the daemon discovers
      # its own mapping via STUN, which only works because the port below is
      # published.
      NVPN_ADVERTISED_ENDPOINT: ${NVPN_ADVERTISED_ENDPOINT:-}
      # on: dial nvpn's two built-in public FIPS transit seeds (joins the
      # public FIPS mesh). off: never dial them. See .env.example.
      NVPN_FIPS_BOOTSTRAP: ${NVPN_FIPS_BOOTSTRAP:-on}
    # WireGuard underlay. Without this published, the container's only
    # address is the Docker-internal 172.28.53.10, which no other device can
    # reach and which STUN cannot map — peers then show as present (they
    # announce over the relays) while no data path ever forms, so DNS reaches
    # nobody. Published on all host interfaces on purpose: this is the port
    # other devices connect *to*, and it is an authenticated WireGuard
    # listener, not an admin surface.
    ports:
      - "${NVPN_LISTEN_PORT:-51820}:51820/udp"
    networks:
      dns-internal:
        ipv4_address: 172.28.53.10
    healthcheck:
      test: ["CMD-SHELL", "nvpn status >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Browser control panel (nvpn-web) for approving join requests, adding
  # devices, etc. without touching a terminal — the same image nvpn builds,
  # just run with a different entrypoint/command. Reads the *same* config
  # volume as nvpn's actual daemon rather than running its own, hence
  # NVPN_EXTERNAL_DAEMON + state-file status mode. Binds 0.0.0.0 inside the
  # container (required for Docker's port publish to reach it at all) but
  # is only ever published to the host's loopback — this server has no
  # login of its own, so exposing it beyond localhost would let anyone who
  # can reach that port approve/remove devices on your mesh.
  web:
    build:
      context: ./nvpn
      args:
        NVPN_REPO: https://github.com/btcforplebs/nostr-vpn.git
        NVPN_COMMIT: fc0ab76574134809536bb2414ec3d5684cfd34a1
    container_name: sovereign-dns-web
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/nvpn-web"]
    command:
      - --listen
      - 0.0.0.0:8081
      - --behind-trusted-proxy
      - --config
      - /root/.config/nvpn/config.toml
    depends_on:
      nvpn:
        condition: service_healthy
    volumes:
      - nvpn-config:/root/.config/nvpn
    environment:
      NVPN_CLI_PATH: /usr/local/bin/nvpn
      NVPN_EXTERNAL_DAEMON: "true"
      NVPN_DAEMON_STATUS_MODE: state-file
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-8082}:8081"

  # Pi-hole shares the nvpn container's network namespace so it can bind the
  # mesh tunnel interface (utun100) directly: DNS queries arriving at this
  # device's mesh IP hit Pi-hole, while nvpn's own stubs keep 127.0.0.1.
  # listeningMode=BIND is what keeps the two from colliding — same pattern the
  # nostr-vpn repo's own network-DNS e2e uses (dnsmasq --bind-interfaces).
  pihole:
    # Pinned by digest (the tag is for people; Docker uses only the digest).
    # Bump both together: scripts/check-pins.sh fails on an unpinned image.
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: sovereign-dns-pihole
    restart: unless-stopped
    network_mode: service:nvpn
    depends_on:
      nvpn:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      # Upstream is Unbound only — fully recursive, no Google/Cloudflare.
      FTLCONF_dns_upstreams: 172.28.53.11#53
      # Bind only the mesh tunnel interface; 127.0.0.1:53 stays free for nvpn.
      FTLCONF_dns_interface: ${NVPN_TUN_IFACE:-utun100}
      FTLCONF_dns_listeningMode: BIND
      FTLCONF_dns_dnssec: "true"
      # No NTP server. Stock FTL listens on 0.0.0.0:123 and [::]:123, which
      # serves time to every mesh device; the box has no reason to. One line
      # per address family: each closes only its own socket. ntp.sync (the
      # box's own outbound client) is separate and stays on.
      # scripts/check-pins.sh fails if either line is lost.
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      # The web UI is reachable over the mesh at http://<mesh-ip>/admin
      FTLCONF_webserver_port: ${PIHOLE_WEB_PORT:-80}
    volumes:
      - pihole-config:/etc/pihole
    cap_add:
      - NET_BIND_SERVICE
    # Pi-hole lives inside nvpn's network namespace, and that binding does not
    # survive nvpn being recreated or restarted: Docker leaves this container
    # attached to a namespace that no longer has the mesh interface, so it
    # keeps reporting healthy and answering on its own loopback while DNS is
    # dead for every real client. Checking for the tunnel interface itself is
    # what makes that state visible instead of silent. Recreate this service
    # after anything that restarts nvpn.
    healthcheck:
      test: ["CMD-SHELL", "grep -q '${NVPN_TUN_IFACE:-utun100}' /proc/net/dev"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Unbound: recursive resolver walking down from the root servers, DNSSEC
  # validating. Internal-only — nothing is published to the host or the mesh;
  # only Pi-hole talks to it.
  unbound:
    # Built from unbound/Dockerfile: a digest-pinned Alpine base with exact
    # package versions, native on arm64 and amd64. scripts/check-pins.sh fails
    # if either pin goes missing. It replaces mvance/unbound, which is
    # amd64-only and ran under emulation on Apple Silicon until that emulation
    # broke. No forward-zone exists anywhere in the image's config, so nothing
    # needs mounting over it.
    build:
      context: ./unbound
    container_name: sovereign-dns-unbound
    restart: unless-stopped
    networks:
      dns-internal:
        ipv4_address: 172.28.53.11
    healthcheck:
      # Resolves a never-before-seen name every run, so it fails as soon as
      # recursion breaks instead of answering from cache. See the script.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Landing page: what's running, the real URLs with the mesh IP filled in,
  # and the invite command that otherwise only exists in `docker compose logs`.
  # Read-only by design — it launches the other UIs rather than duplicating
  # them, holds no credentials, and gets no docker.sock (a web-facing
  # container with the socket is root on the host). Joined to dns-internal so
  # it can probe Pi-hole and Unbound, which the browser cannot reach.
  # Published to loopback only: it fronts an admin surface with no login.
  hub:
    build:
      context: ./hub
    container_name: sovereign-dns-hub
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WEB_UI_PORT: ${WEB_UI_PORT:-8082}
      DOCS_PORT: ${DOCS_PORT:-8081}
      PIHOLE_WEB_PORT: ${PIHOLE_WEB_PORT:-80}
    depends_on:
      nvpn:
        condition: service_healthy
    # Both networks on purpose: the panel and docs sit on the default network,
    # Pi-hole and Unbound only on dns-internal.
    networks:
      - default
      - dns-internal
    ports:
      - "127.0.0.1:${HUB_PORT:-8080}:8080"

  # Self-hosted docs site (mdBook) — explains the whole stack in plain
  # language plus the technical detail behind each layer. Runs standalone;
  # no dependency on the other services, so it's up even before you've
  # joined the mesh. Loopback only, like the hub and the web UI: nothing on
  # the LAN needs it, and scripts/check-pins.sh allows no other publish.
  docs:
    build:
      context: ./docs
    container_name: sovereign-dns-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCS_PORT:-8081}:80"

networks:
  dns-internal:
    driver: bridge
    internal: false   # nvpn needs outbound reach (relay + WireGuard underlay); unbound needs the root servers
    ipam:
      config:
        - subnet: 172.28.53.0/24

volumes:
  nvpn-config:
  pihole-config:
