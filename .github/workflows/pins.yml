# The gates that otherwise only run by hand or in the opt-in pre-commit hook:
# install.sh is byte for byte what the tree builds, every pin is present, and
# every pinned tag still points at its digest on its registry (Docker Hub, and
# ghcr.io for the prebuilt nvpn image). Without --verify-remote, an override
# carrying this tree's tag and a wrong digest would pass every other gate.
name: pins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh matches the tree, pins present
        run: scripts/make-installer.sh --check
      - name: Every pinned tag still points at its digest
        run: scripts/check-pins.sh --verify-remote
