# Builds the ready-made images that installs download instead of building each
# service on the device (docker-compose.prebuilt.yml, scripts/repin-prebuilt.sh):
# one per folder the stack builds from, nvpn/, unbound/, hub/ and docs/, named
# by scripts/lib/prebuilt-images.sh. An image whose tag is already on ghcr.io
# is the same build input, so only the missing ones are built.
#
# Pull requests: build only. Each architecture builds natively, then the
# installer's fast path is exercised on the runner: the new images go to a
# throwaway local registry, the rest are pulled from ghcr.io, and the stack
# must come up healthy with compose building nothing. Nothing leaves the
# runner. This job has no registry login and no write permission.
#
# Publish: every push to main, or by hand (Actions > prebuilt images > Run
# workflow on main, with "publish" ticked). Pushes the missing images to
# ghcr.io/btcforplebs/sovereign-dns-<folder> under the tag the tree names, and
# signs build provenance for each index digest, which
# scripts/repin-prebuilt.sh checks before pinning, including that the commit
# it names builds the tag. A package's first publish
# creates it as private: make it public in the package settings, or installs
# cannot pull it and fall back to source.
#
# The file keeps its old name: repin-prebuilt.sh verifies attestations against
# this exact workflow path, including the ones already published for nvpn.
name: prebuilt images

on:
  pull_request:
    paths:
      - nvpn/**
      - unbound/**
      - hub/**
      - docs/**
      - scripts/lib/prebuilt-images.sh
      - scripts/test-daemon-recovery.sh
      - docker-compose.yml
      - docker-compose.prebuilt.yml
      - .github/workflows/nvpn-image.yml
  push:
    branches: [main]
    paths:
      - nvpn/**
      - unbound/**
      - hub/**
      - docs/**
      - scripts/lib/prebuilt-images.sh
      - .github/workflows/nvpn-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the missing images to ghcr.io (main only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The BuildKit the builds run in, pinned like every other image here.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

jobs:
  # Which images this tree names that ghcr.io does not have yet.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source scripts/lib/prebuilt-images.sh
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          missing=()
          # Missing: an answer that says so. Anything that could not be
          # checked fails the plan instead: rebuilding on a blip would push
          # the tag to a new digest (builds are not reproducible) and turn
          # every pinned check red until a repin.
          die() { echo "plan: $*" >&2; exit 1; }
          for img in $(prebuilt_images); do
            repo=$(prebuilt_repo "$img"); tag=$(prebuilt_tag "$img"); name=${repo#ghcr.io/}
            state=published
            # Anonymous, like an install: no token for an absent or private
            # package, no manifest for an unpublished tag.
            code=$(curl -sS -o "$RUNNER_TEMP/token" -w '%{http_code}' \
                     "https://ghcr.io/token?service=ghcr.io&scope=repository:$name:pull" 2>/dev/null) || code=000
            case "$code" in
              200) token=$(jq -r .token "$RUNNER_TEMP/token") ;;
              401|403|404) state=missing ;;
              *) die "ghcr.io token for $name: HTTP $code" ;;
            esac
            if [[ "$state" == published ]]; then
              code=$(curl -sS -I -o "$RUNNER_TEMP/head" -w '%{http_code}' -H "Authorization: Bearer $token" -H "Accept: $accept" \
                       "https://ghcr.io/v2/$name/manifests/$tag" 2>/dev/null) || code=000
              case "$code" in
                200) digest=$(tr -d '\r' <"$RUNNER_TEMP/head" | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')
                     [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "$repo:$tag has digest '$digest'" ;;
                404) state=missing ;;
                *) die "ghcr.io manifest $repo:$tag: HTTP $code" ;;
              esac
            fi
            # Published also means attested by this workflow on main: a tag
            # left by a run that died before attesting is built again. The
            # API answers 404 when the digest has no attestation at all.
            if [[ "$state" == published ]]; then
              code=$(gh api -i "repos/$GITHUB_REPOSITORY/attestations/$digest" 2>/dev/null | head -n1 | awk '{print $2}') || true
              case "$code" in
                200) gh attestation verify "oci://$repo@$digest" \
                       --repo "$GITHUB_REPOSITORY" \
                       --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nvpn-image.yml" \
                       --source-ref refs/heads/main >/dev/null \
                       || die "$repo@$digest has attestations but none verifies as this workflow's on main; look before anything republishes it" ;;
                404) state=missing ;;
                *) die "attestations API for $repo@$digest: HTTP ${code:-none}" ;;
              esac
            fi
            echo "- $repo:$tag: $state" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$state" == missing ]]; then missing+=("$img"); fi
          done
          echo "missing=$(printf '%s\n' "${missing[@]}" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$REF" == refs/heads/main ]] && { [[ "$EVENT" == push ]] || [[ "$EVENT" == workflow_dispatch && "$PUBLISH_INPUT" == true ]]; }; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.publish != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the missing images (no push)
        env:
          MISSING: ${{ needs.plan.outputs.missing }}
        run: |
          set -euo pipefail
          source scripts/lib/prebuilt-images.sh
          docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
          for img in $(jq -r '.[]' <<<"$MISSING"); do
            start=$SECONDS
            docker buildx build --platform "linux/${{ matrix.arch }}" --load -t "sdns-$img:ci" "$img"
            secs=$((SECONDS - start))
            gz=$(docker save "sdns-$img:ci" | gzip -c | wc -c)
            {
              echo "### linux/${{ matrix.arch }}: $(prebuilt_repo "$img"):$(prebuilt_tag "$img")"
              echo "- build: $((secs / 60)) min $((secs % 60)) s on ${{ matrix.runner }}"
              echo "- image: $(docker image inspect -f '{{.Size}}' "sdns-$img:ci" | awk '{printf "%.0f MB", $1/1e6}') unpacked, about $(awk -v b="$gz" 'BEGIN{printf "%.0f MB", b/1e6}') to download"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if jq -e 'index("nvpn")' <<<"$MISSING" >/dev/null; then
            docker run --rm --entrypoint /usr/local/bin/nvpn sdns-nvpn:ci --version
            docker run --rm --entrypoint /bin/sh sdns-nvpn:ci -c 'test -x /usr/local/bin/nvpn-web && test -f /usr/share/nostr-vpn/web/index.html'
          fi

      - name: Installer fast path, new images from a local registry
        env:
          MISSING: ${{ needs.plan.outputs.missing }}
          REGISTRY_IMAGE: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
        run: |
          set -euo pipefail
          source scripts/lib/prebuilt-images.sh
          docker run -d --name reg -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          # The same shape scripts/repin-prebuilt.sh writes. A missing image
          # comes from the local registry by digest; a published one is pulled
          # from ghcr.io by the tag this tree names.
          echo services: > docker-compose.prebuilt.yml
          for img in $(prebuilt_images); do
            tag=$(prebuilt_tag "$img")
            if jq -e --arg i "$img" 'index($i)' <<<"$MISSING" >/dev/null; then
              local_name=localhost:5000/sovereign-dns-$img
              docker tag "sdns-$img:ci" "$local_name:$tag"
              docker push -q "$local_name:$tag" >/dev/null
              pushed=$(docker inspect -f '{{index .RepoDigests 0}}' "$local_name:$tag")
              ref="$local_name:$tag@${pushed#*@}"
              # Gone from the engine, so the pull below really downloads it.
              docker image rm "sdns-$img:ci" "$local_name:$tag" >/dev/null
            else
              ref=$(prebuilt_repo "$img"):$tag
              docker pull -q "$ref" >/dev/null
              ref="$ref@$(docker inspect -f '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)"
              docker image rm "${ref%@*}" >/dev/null
            fi
            for s in $(prebuilt_services "$img"); do
              printf '  %s:\n    build: !reset null\n    image: %s\n' "$s" "$ref" >> docker-compose.prebuilt.yml
            done
          done
          cat docker-compose.prebuilt.yml
          # docs is an opt-in profile; turn it on so its image is checked too.
          printf 'PIHOLE_PASSWORD=ci\nCOMPOSE_FILE=docker-compose.yml:docker-compose.prebuilt.yml\nCOMPOSE_PROFILES=docs\n' > .env

          # What install.sh runs: check the merge, pull every image by
          # digest, then the plain `up -d --build` (COMPOSE_FILE from .env
          # loads both files).
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml config -q
          start=$SECONDS
          docker compose pull -q
          pulled=$((SECONDS - start))
          docker compose up -d --build
          # Nothing built: compose tags a build as <project>-<service>, so no
          # such name may exist. (Its progress output is no evidence either
          # way: it prints "Building 0.0s (0/0)" when there is nothing to build.)
          for s in nvpn web unbound hub hub-mesh docs; do
            if docker image inspect "sovereign-dns-$s" >/dev/null 2>&1; then
              echo "compose built $s on the fast path; it should only have pulled" >&2; exit 1
            fi
            want=$(awk -v s="  $s:" '$0 == s { a = 1; next } a && /^    image: / { print $2; exit }' docker-compose.prebuilt.yml)
            img=$(docker inspect -f '{{.Config.Image}}' "sovereign-dns-$s")
            [[ "$img" == "$want" ]] || { echo "$s runs $img, not $want" >&2; exit 1; }
          done
          for s in nvpn pihole unbound; do
            for _ in $(seq 1 60); do
              h=$(docker inspect -f '{{.State.Health.Status}}' "sovereign-dns-$s")
              [[ "$h" == healthy ]] && break; sleep 3
            done
            [[ "$h" == healthy ]] || { docker compose logs "$s" | tail -50; echo "$s is $h" >&2; exit 1; }
          done
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/ >/dev/null || { docker compose logs hub | tail -50; echo "hub does not answer" >&2; exit 1; }
          # Read the page first: under pipefail, grep -q quitting early makes curl
          # fail with SIGPIPE and the pipeline fail on a healthy page.
          docs_page=$(curl -fsS http://127.0.0.1:8081/ || true)
          grep -q '<title>' <<<"$docs_page" || { docker compose logs docs | tail -20; echo "docs does not answer" >&2; exit 1; }
          echo "- fast path: pull $pulled s, pull to healthy stack in $((SECONDS - start)) s, nothing built" >> "$GITHUB_STEP_SUMMARY"
          # The same stack, with its daemon killed: the box must bring it back
          # by itself (what a 512 MB VPS needed after the kernel killed it).
          bash scripts/test-daemon-recovery.sh || { docker compose logs nvpn | tail -60; exit 1; }
          docker compose down -v

  publish:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.missing != '[]' }}
    strategy:
      matrix:
        img: ${{ fromJSON(needs.plan.outputs.missing) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pushed by digest only, with no per-architecture tag: nothing in the
      # registry names these bytes except the index below, which is built from
      # the digests this job hands over, never from a tag that could be moved
      # in between.
      - name: Build and push ${{ matrix.img }} linux/${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMG: ${{ matrix.img }}
        run: |
          set -euo pipefail
          source scripts/lib/prebuilt-images.sh
          repo=$(prebuilt_repo "$IMG")
          labels=(--label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
                  --label "org.opencontainers.image.revision=${{ github.sha }}")
          if [[ "$IMG" == nvpn ]]; then labels+=(--label "nvpn.commit=$(nvpn_image_commit)"); fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
          # No BuildKit provenance/SBOM on the per-arch images: each must be a
          # plain manifest, which the index step asserts (it lists exactly
          # these digests). Provenance is attested on the index instead.
          docker buildx build --platform "linux/${{ matrix.arch }}" "${labels[@]}" \
            --provenance=false --sbom=false \
            --output "type=image,name=$repo,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" "$IMG"
          mkdir -p "$RUNNER_TEMP/digest"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["containerimage.digest"]; assert d.startswith("sha256:") and len(d) == 71, d; print(d)' \
            "$RUNNER_TEMP/meta.json" > "$RUNNER_TEMP/digest/${{ matrix.arch }}"
          cat "$RUNNER_TEMP/digest/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.img }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  index:
    needs: [plan, publish]
    strategy:
      matrix:
        img: ${{ fromJSON(needs.plan.outputs.missing) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Signed build provenance for the index digest: repin-prebuilt.sh
      # refuses a digest this workflow, on main, did not attest, and holds the
      # commit it names to the tag it pins.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.img }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: One tag for both architectures, from their digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMG: ${{ matrix.img }}
        run: |
          set -euo pipefail
          source scripts/lib/prebuilt-images.sh
          repo=$(prebuilt_repo "$IMG"); tag=$(prebuilt_tag "$IMG")
          refs=()
          for arch in amd64 arm64; do
            d=$(cat "$RUNNER_TEMP/digest/$arch")
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad $arch digest '$d'" >&2; exit 1; }
            refs+=("$repo@$d")
          done
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The index digest is computed here from the exact bytes, not read
          # back from the tag: --dry-run prints the index create pushes (plus
          # one newline, dropped).
          docker buildx imagetools create --dry-run -t "$repo:$tag" "${refs[@]}" \
            | python3 -I -c 'import sys; b = sys.stdin.buffer.read(); sys.stdout.buffer.write(b[:-1] if b.endswith(b"\n") else b)' \
            > "$RUNNER_TEMP/index.json"
          digest="sha256:$(sha256sum < "$RUNNER_TEMP/index.json" | cut -d' ' -f1)"
          python3 -I -c '
          import json, sys
          idx = json.load(open(sys.argv[1]))
          got = sorted(m["digest"] for m in idx["manifests"])
          assert got == sorted(sys.argv[2:]), (got, sys.argv[2:])
          ' "$RUNNER_TEMP/index.json" "${refs[@]#*@}"
          docker buildx imagetools create -t "$repo:$tag" "${refs[@]}"
          # The registry must hold exactly those bytes under that digest.
          name=${repo#ghcr.io/}
          token=$(curl -fsS -u "${{ github.actor }}:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$name:pull" \
                    | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$name/manifests/$digest" -o "$RUNNER_TEMP/stored.json"
          cmp "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/stored.json"
          echo "REPO=$repo" >> "$GITHUB_ENV"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo "### Published $repo:$tag"
            echo "Digest: \`$digest\` (amd64 ${refs[0]#*@}, arm64 ${refs[1]#*@})"
            echo
            echo "Make the package public (first publish only), then pin: \`scripts/repin-prebuilt.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
