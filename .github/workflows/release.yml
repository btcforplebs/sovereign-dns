# Publishes install.sh and its hash when a version tag is pushed, after
# checking that install.sh is what the tagged tree builds. Pull requests run
# the same checks (no release, no signing) so this file cannot rot unseen.
#
# Settings that make a release trustworthy live in the repository, not here:
# immutable releases, and a ruleset protecting v* tags from being moved or
# deleted. RELEASING.md lists them.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-assets.sh
      - scripts/test-release-assets.sh

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # sign the files
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The refusals and the verify line
        run: bash scripts/test-release-assets.sh
      - name: Pins still point at their digests
        run: scripts/check-pins.sh --verify-remote
      - name: Build the release files, or refuse
        if: github.event_name == 'push'
        run: scripts/release-assets.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Sign the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/install.sh
            ${{ runner.temp }}/release/install.sh.sha256
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/install.sh" "$RUNNER_TEMP/release/install.sh.sha256" \
            --title "Sovereign DNS $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            --verify-tag
