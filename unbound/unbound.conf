# Recursive, validating resolver for Pi-hole. No forward-zone: it resolves
# from the root servers itself, so no third party sees the network's lookups.
server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # Docker's bridge network has no IPv6 route. With do-ip6 on, Unbound tries
    # AAAA glue, times out, marks those servers down in its infra cache and
    # returns SERVFAIL for zones whose servers it now thinks are unreachable.
    do-ip6: no
    prefer-ip6: no

    # Only the stack's own network may query. Pi-hole reaches us from
    # 172.28.53.0/24 (it shares the nvpn container's network namespace).
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""
    use-syslog: no
    logfile: ""

    # Enough logging to catch a failure the next time it happens: every
    # SERVFAIL is logged with the name and the reason.
    verbosity: 1
    log-servfail: yes
    val-log-level: 2

    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: no
    qname-minimisation: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Keep probing servers marked down instead of answering SERVFAIL from the
    # infra cache until it expires (the "wedge" until restart pattern).
    infra-keep-probing: yes
    infra-host-ttl: 300

    prefetch: yes
    prefetch-key: yes
    # Two threads are plenty: answering ~3,500 cached queries a second used
    # under 12% CPU, and the busiest mesh device peaks near 14 a second. The
    # slab counts are set to match it (each must be a power of two). The whole
    # live process sits near 30 MB, so the caches below are not full and a
    # bigger cap would only raise the ceiling.
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    so-reuseport: yes
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # Serve-stale (RFC 8767), only as a fallback. Unbound tries the real
    # servers first and hands out an expired answer only if no fresh one has
    # arrived after 1.8 s, with a 30 s TTL so clients ask again soon. Nothing
    # older than an hour past its TTL is served. Only answers that already
    # passed validation are in the cache, so this never serves a bogus answer.
    # But for up to that hour it can serve a record its owner has since
    # changed or revoked, and only while the real servers cannot be reached.
    # Stale answers would hide a broken resolver from any check that asks for
    # a fixed name. So both unbound/healthcheck.sh (the container health
    # check) and scripts/healthcheck.sh (the acceptance checks) resolve a
    # brand-new random name, which never comes from cache.
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800
    serve-expired-reply-ttl: 30

    # DNS rebind protection: an outside name may not answer with a private IP.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    # IPv4-mapped IPv6 (::ffff:10.0.0.1 and friends). do-ip6: no does not stop
    # AAAA answers, so without this a private IPv4 can arrive dressed as IPv6.
    private-address: ::ffff:0:0/96
