# Recursive, validating resolver for Pi-hole. No forward-zone: it resolves
# from the root servers itself, so no third party sees the network's lookups.
server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # Docker's bridge network has no IPv6 route. With do-ip6 on, Unbound tries
    # AAAA glue, times out, marks those servers down in its infra cache and
    # returns SERVFAIL for zones whose servers it now thinks are unreachable.
    do-ip6: no
    prefer-ip6: no

    # Only the stack's own network may query. Pi-hole reaches us from
    # 172.28.53.0/24 (it shares the nvpn container's network namespace).
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""
    use-syslog: no
    logfile: ""

    # Enough logging to catch a failure the next time it happens: every
    # SERVFAIL is logged with the name and the reason.
    verbosity: 1
    log-servfail: yes
    val-log-level: 2

    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: no
    qname-minimisation: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Keep probing servers marked down instead of answering SERVFAIL from the
    # infra cache until it expires (the "wedge" until restart pattern).
    infra-keep-probing: yes
    infra-host-ttl: 300

    prefetch: yes
    prefetch-key: yes
    num-threads: 2
    so-reuseport: yes
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # DNS rebind protection: an outside name may not answer with a private IP.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    # IPv4-mapped IPv6 (::ffff:10.0.0.1 and friends). do-ip6: no does not stop
    # AAAA answers, so without this a private IPv4 can arrive dressed as IPv6.
    private-address: ::ffff:0:0/96
